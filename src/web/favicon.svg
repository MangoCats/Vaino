<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- Background: Kalevala Blue -->
  <rect width="32" height="32" rx="6" fill="#003580" />

  <g transform="translate(1, 1)">
    <!-- Dynamic Speed Background Glow: Neon Cyan -->
    <path d="M 6 22 L 24 6 L 27 9 L 9 25 Z" fill="#00F2FE" opacity="0.3" filter="blur(1px)" />

    <!-- Kantele Frame: Lightning Silver/White -->
    <!-- Stylized wing shape tilted forward at 45 degrees to imply high speed -->
    <path d="M 6 22 L 24 6 L 27 9 L 17 23 L 9 25 Z" 
          fill="#F5F5F7" 
          stroke="#00F2FE" 
          stroke-width="1" 
          stroke-linejoin="round" />

    <!-- Sound Hole / Core: Neon Cyan/Teal -->
    <circle cx="17" cy="15" r="2" fill="#00F2FE" />

    <!-- Audio Strings / Lightning Bolts: Neon Cyan -->
    <!-- Strings are styled like forward-slanting equalizer/speed lines -->
    <line x1="9"  y1="19" x2="21" y2="7"  stroke="#00F2FE" stroke-width="1.2" stroke-linecap="round" />
    <line x1="12" y1="20" x2="23" y2="9"  stroke="#00F2FE" stroke-width="1.2" stroke-linecap="round" />
    <line x1="15" y1="21" x2="25" y2="11" stroke="#00F2FE" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>
