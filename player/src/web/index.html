<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaino</title>
<style>
  :root { color-scheme: light dark; --fg: #111; --dim: #667; --bg: #fbfbfa; --line: #dcdcd8; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #eee; --dim: #99a; --bg: #141416; --line: #2c2c30; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 34rem; margin: 0 auto; padding: 2rem 1.25rem; }
  h1 { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase;
       color: var(--dim); font-weight: 600; margin: 0 0 1.5rem; }
  #title { font-size: 1.4rem; font-weight: 600; min-height: 2.1rem;
           overflow-wrap: anywhere; }
  #bar { height: 4px; background: var(--line); border-radius: 2px; margin: .9rem 0 .4rem; }
  #fill { height: 100%; width: 0; background: currentColor; border-radius: 2px;
          transition: width .5s linear; }
  #time { font-variant-numeric: tabular-nums; color: var(--dim); font-size: .875rem; }
  .controls { display: flex; gap: .5rem; margin: 1.5rem 0; }
  button { font: inherit; padding: .5rem 1.1rem; border: 1px solid var(--line);
           background: transparent; color: inherit; border-radius: 6px; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .3rem 1rem;
       font-size: .875rem; color: var(--dim); margin: 0; }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  section { border-top: 1px solid var(--line); margin-top: 1.75rem; padding-top: 1.25rem; }
  h2 { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase;
       color: var(--dim); font-weight: 600; margin: 0 0 .6rem; }
  #why { font-size: .875rem; color: var(--dim); }
  h3 { font-size: .8125rem; color: var(--dim); font-weight: 600; margin: 1.1rem 0 .4rem; }
  #terms { width: 100%; border-collapse: collapse; font-size: .875rem; }
  #terms td { padding: .22rem 0; border-bottom: 1px solid var(--line); }
  #terms td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  #terms tr.total td { font-weight: 600; border-bottom: none; color: var(--fg); }
  #terms td:first-child { color: var(--dim); }
  #terms .inert td { opacity: .45; }
  #losers ol { margin: 0; padding-left: 1.2rem; font-size: .875rem; color: var(--dim); }
  #losers li { padding: .12rem 0; }
  #losers .w { font-variant-numeric: tabular-nums; opacity: .75; }
  #stages { font-size: .75rem; color: var(--dim); opacity: .7; margin: 1rem 0 0; }
  #link { opacity: .55; font-size: .8125rem; margin-top: 2rem; }
  #vol { display: flex; align-items: center; gap: .5rem; margin-left: auto; }
  #volume { width: 7rem; accent-color: currentColor; }
  #volnum { font-variant-numeric: tabular-nums; color: var(--dim);
            font-size: .8125rem; min-width: 2.6rem; text-align: right; }
  .progline { display: flex; align-items: center; gap: .6rem; font-size: .875rem;
              color: var(--dim); margin: -.6rem 0 .4rem; }
  select { font: inherit; font-size: .875rem; padding: .25rem .4rem; color: inherit;
           background: transparent; border: 1px solid var(--line); border-radius: 6px; }
  #progmode { font-size: .75rem; opacity: .7; }
  #queue { margin: 0; padding-left: 1.4rem; font-size: .875rem; color: var(--dim); }
  #queue li { padding: .16rem 0; overflow-wrap: anywhere; }
  #queue li:first-child { color: var(--fg); }
  #queue .dur { font-variant-numeric: tabular-nums; opacity: .6; }
  #queue .empty { list-style: none; margin-left: -1.4rem; opacity: .6; }
</style>

<main>
  <h1>Vaino</h1>
  <div id="title">—</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="time">0:00 / 0:00</div>

  <div class="controls">
    <button data-cmd="play">Play</button>
    <button data-cmd="pause">Pause</button>
    <button data-cmd="skip">Skip</button>
    <label id="vol"><input type="range" id="volume" min="0" max="100" step="1"><span id="volnum">100%</span></label>
  </div>

  <div class="progline">
    <label for="prog">Programme</label>
    <select id="prog"></select>
    <span id="progmode"></span>
  </div>

  <section>
    <h2>Up next</h2>
    <ol id="queue"><li class="empty">nothing queued</li></ol>
  </section>

  <dl>
    <dt>State</dt><dd id="state">—</dd>
    <dt>Queue</dt><dd id="queuelen">—</dd>
    <dt>Underruns</dt><dd id="under">—</dd>
  </dl>

  <section>
    <h2>Why this track?</h2>
    <div id="why">Waiting for a selection…</div>
    <table id="terms" hidden>
      <tbody></tbody>
    </table>
    <div id="losers" hidden>
      <h3>It beat</h3>
      <ol></ol>
    </div>
    <p id="stages"></p>
  </section>

  <div id="link">Connecting…</div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const clock = ms => {
    const t = Math.max(0, Math.round(ms / 1000));
    return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  };

  for (const b of document.querySelectorAll('button[data-cmd]')) {
    b.onclick = () => fetch(`/command/${b.dataset.cmd}`, { method: 'POST' });
  }

  // While dragging, the slider is the truth; adopting the pushed value mid-drag
  // would fight the user's thumb every 500 ms.
  let holdingVolume = false;
  const vol = $('volume');
  vol.oninput = () => {
    holdingVolume = true;
    $('volnum').textContent = vol.value + '%';
  };
  vol.onchange = () => {
    holdingVolume = false;
    fetch(`/volume/${vol.value}`, { method: 'POST' });
  };
  $('prog').onchange = e => fetch(`/program/${e.target.value}`, { method: 'POST' });

  // Each message is a complete snapshot, so rendering is a pure function of
  // the last one received. No accumulated client state means no drift.
  function render(s) {
    $('title').textContent = s.title ?? '—';
    $('time').textContent = `${clock(s.position_ms)} / ${clock(s.duration_ms)}`;
    $('fill').style.width =
      s.duration_ms ? `${(s.position_ms / s.duration_ms) * 100}%` : '0';
    $('state').textContent = s.playing ? 'playing' : 'paused';
    $('under').textContent = s.underrun_samples;
    renderQueue(s.queue, s.queue_len);
    renderProgram(s);
    if (!holdingVolume) {
      const pct = Math.round((s.volume ?? 1) * 100);
      vol.value = pct;
      $('volnum').textContent = pct + '%';
    }
    renderWhy(s.why);
  }

  // Each term is shown separately, never just the product: a single number
  // cannot be argued with, and arguing with it is the point [SPEC-DIR-190].
  // Terms sitting at 1.0 did nothing, and are dimmed rather than hidden --
  // "this did not apply" is itself part of the answer.
  const TERMS = [
    ['Artist recovery',  w => w.artist_weight],
    ['Track restraint',  w => w.track_restraint],
    ['Track recovery',   w => w.track_ramp],
    ['Related damping',  w => w.related_damping],
    ['Length bonus',     w => w.length_bonus],
    ['Occasion',         w => w.occasion],
  ];

  function renderQueue(items, total) {
    const ol = $('queue');
    $('queuelen').textContent = total ?? 0;
    ol.textContent = '';
    if (!items || !items.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'nothing queued';
      ol.appendChild(li);
      return;
    }
    for (const q of items) {
      const li = document.createElement('li');
      li.textContent = q.title + ' ';
      const d = document.createElement('span');
      d.className = 'dur';
      d.textContent = clock(q.duration_ms);
      li.appendChild(d);
      ol.appendChild(li);
    }
  }

  // The <option> list is rebuilt only when it actually changes; replacing it on
  // every push would close the dropdown in the user's hand.
  let progSig = '';
  function renderProgram(s) {
    const sel = $('prog');
    const sig = (s.programs || []).map(p => p.id + p.name).join('|');
    if (sig !== progSig) {
      progSig = sig;
      sel.textContent = '';
      const auto = document.createElement('option');
      auto.value = 'auto';
      auto.textContent = 'Automatic (by time of day)';
      sel.appendChild(auto);
      for (const p of s.programs || []) {
        const o = document.createElement('option');
        o.value = p.id;
        o.textContent = `${p.name} — from ${p.start}`;
        sel.appendChild(o);
      }
    }
    if (!s.program_manual) sel.value = 'auto';
    else {
      const m = (s.programs || []).find(p => p.name === s.program);
      if (m) sel.value = String(m.id);
    }
    $('progmode').textContent = s.program
      ? (s.program_manual ? `${s.program}, chosen` : `${s.program}, by the clock`)
      : '';
  }

  function renderWhy(w) {
    const terms = $('terms'), losers = $('losers');
    if (!w) {
      $('why').textContent =
        'This passage was not chosen by the Program Director — it was resumed, ' +
        'or queued before the log began.';
      terms.hidden = losers.hidden = true;
      $('stages').textContent = '';
      return;
    }
    const prog = w.program ? `${w.program}: ` : '';
    $('why').textContent =
      `${prog}weight ${w.decayed_weight.toFixed(3)} of ${w.pool_weight.toFixed(1)} across ` +
      `${w.pool_size.toLocaleString()} candidates — a ` +
      `${w.share_pct.toFixed(2)}% chance of being picked.`;

    const body = terms.querySelector('tbody');
    body.textContent = '';
    for (const [label, get] of TERMS) {
      const v = get(w);
      const tr = body.insertRow();
      if (Math.abs(v - 1) < 1e-9) tr.className = 'inert';
      tr.insertCell().textContent = label;
      tr.insertCell().textContent = '×' + v.toFixed(4);
    }
    const tot = body.insertRow();
    tot.className = 'total';
    tot.insertCell().textContent = 'Frequency weight';
    tot.insertCell().textContent = w.weight.toFixed(4);

    // Stage B/C terms: how it FIT, kept visually apart from how OFTEN it may
    // play. The two stories stay separate all the way to the screen.
    const add = (label, text) => {
      const tr = body.insertRow();
      tr.insertCell().textContent = label;
      tr.insertCell().textContent = text;
    };
    if (w.shaping && !w.shaping.bypassed) {
      add('Pool shaping', `${w.shaping.eligible_in.toLocaleString()} eligible → ` +
                         `${w.shaping.gathered} gathered, ${w.shaping.seeds_used} seeds`);
      if (w.shaping.disliked_out) add('Disliked out', String(w.shaping.disliked_out));
    }
    if (w.seed_distances && w.seed_distances.length) {
      add('Distance to seeds', w.seed_distances.map(d => d.toFixed(2)).join(', '));
    }
    if (w.flow_distance != null) add('Follows previous by', w.flow_distance.toFixed(3));
    add('Flow rank', `#${w.rank + 1}`);
    const decayed = body.insertRow();
    decayed.className = 'total';
    decayed.insertCell().textContent = 'Roulette weight';
    decayed.insertCell().textContent = w.decayed_weight.toFixed(4);
    terms.hidden = false;

    const ol = losers.querySelector('ol');
    ol.textContent = '';
    for (const r of w.runners_up ?? []) {
      const li = document.createElement('li');
      li.textContent = r.title + ' ';
      const span = document.createElement('span');
      span.className = 'w';
      span.textContent = `(${r.weight.toFixed(3)})`;
      li.appendChild(span);
      ol.appendChild(li);
    }
    losers.hidden = ol.children.length === 0;
    $('stages').textContent = w.stages ?? '';
  }

  // Reconnect rather than go stale: the player outlives any one page load,
  // and a silently dead socket looks exactly like paused playback.
  (function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onmessage = e => render(JSON.parse(e.data));
    ws.onopen = () => ($('link').textContent = 'Connected');
    ws.onclose = () => {
      $('link').textContent = 'Reconnecting…';
      setTimeout(connect, 1000);
    };
  })();
</script>
